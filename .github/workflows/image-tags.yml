name: Image tags
on:
  pull_request:
    paths:
      - "variables.yml"

permissions:
  contents: read

jobs:
  check-image-tags:
    name: check Docker image tags
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Check that the tags exist on Docker Hub
        run: python .github/scripts/check_image_tags.py
